<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#171a21" />
  <title>Style Trainer</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="login-page">
  <form id="login" class="card login-card">
    <img src="/icons/icon-192.png" alt="" width="64" height="64" />
    <h1>Style Trainer</h1>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" autofocus required />
    <button class="btn primary" type="submit">Log in</button>
    <p id="error" class="notice err" hidden></p>
  </form>
  <script>
    document.getElementById('login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('error');
      err.hidden = true;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('password').value }),
      });
      if (res.ok) return location.replace('/');
      err.textContent = (await res.json().catch(() => ({}))).error || 'Could not log in';
      err.hidden = false;
    });
  </script>
</body>
</html>
